name: Sync calendar & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # mixxlog.com doesn't send CORS headers, so mirror the feed next to the site.
      - name: Fetch MIXXlog calendar feed
        run: |
          if curl -fsSL --retry 3 https://mixxlog.com/api/calendar/feed.ics -o /tmp/feed.ics \
             && grep -q "BEGIN:VCALENDAR" /tmp/feed.ics; then
            mv /tmp/feed.ics data/feed.ics
          else
            echo "::warning::Feed fetch failed; deploying the committed snapshot."
          fi

      - name: Build site
        run: |
          mkdir -p _site
          cp -r index.html assets data _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
