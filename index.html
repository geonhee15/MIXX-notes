<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MIXX-notes</title>
  <meta name="description" content="NMIXX 팬 페이지 — 컴백 카운트다운과 스케줄 캘린더">
  <meta name="theme-color" content="#f4f4f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1c1f" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%23111'/><text x='50%' y='56%' font-family='Arial Black,Arial' font-size='30' font-weight='900' fill='white' text-anchor='middle' dominant-baseline='middle'>N</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    // Apply saved theme before paint to avoid a flash.
    try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="nav glass">
    <a class="brand" href="#/">MIXX<span>-notes</span></a>
    <nav class="nav-links">
      <a href="#/" data-route="home">Home</a>
      <a href="#/music" data-route="music">Music</a>
      <a href="#/calendar" data-route="calendar">Calendar</a>
    </nav>
    <button class="icon-btn" id="theme-toggle" aria-label="테마 전환" title="테마 전환">
      <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <!-- HOME -->
  <main id="view-home" class="view">
    <div class="hero-bg" aria-hidden="true">
      <div id="bg-player"></div>
      <div class="hero-poster" id="hero-poster"></div>
      <div class="hero-veil"></div>
    </div>

    <section class="hero">
      <div class="hero-card glass">
        <p class="eyebrow" id="hero-eyebrow">COMING SOON</p>
        <h1 class="album-title" id="album-title">—</h1>
        <p class="album-meta" id="album-meta"></p>

        <div class="countdown" id="countdown" hidden>
          <div class="cd-cell"><span id="cd-d">00</span><small>DAYS</small></div>
          <div class="cd-cell"><span id="cd-h">00</span><small>HOURS</small></div>
          <div class="cd-cell"><span id="cd-m">00</span><small>MIN</small></div>
          <div class="cd-cell"><span id="cd-s">00</span><small>SEC</small></div>
        </div>

        <p class="release-date" id="release-date"></p>

        <div class="links" id="stream-links" hidden></div>
      </div>

      <button class="icon-btn glass sound-btn" id="sound-toggle" aria-label="소리 켜기" title="소리 켜기" hidden>
        <svg class="i-muted" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="m23 9-6 6M17 9l6 6"/></svg>
        <svg class="i-sound" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
      </button>
    </section>

    <section class="upcoming wrap">
      <div class="section-head">
        <h2>다가오는 일정</h2>
        <a class="more" href="#/calendar">캘린더 전체 보기 →</a>
      </div>
      <ul class="event-list" id="upcoming-list"><li class="muted">불러오는 중…</li></ul>
    </section>
  </main>

  <!-- MUSIC -->
  <main id="view-music" class="view wrap" hidden>
    <div class="music-head">
      <div>
        <h1 class="page-title">Discography</h1>
        <p class="page-sub" id="music-sub">NMIXX와 멤버들이 부른 모든 노래</p>
      </div>
      <div class="segmented glass" role="tablist" aria-label="분류">
        <button role="tab" data-tab="albums" aria-selected="true">앨범</button>
        <button role="tab" data-tab="collabs" aria-selected="false">콜라보 &amp; OST</button>
        <button role="tab" data-tab="members" aria-selected="false">멤버 참여곡</button>
      </div>
    </div>
    <div id="music-filters" class="cal-filters member-filters" hidden></div>
    <div id="music-body"><p class="muted">불러오는 중…</p></div>
  </main>

  <dialog id="album-dialog" class="album-dialog glass" aria-labelledby="dlg-title">
    <div class="dlg-inner" id="dlg-inner"></div>
  </dialog>

  <!-- CALENDAR -->
  <main id="view-calendar" class="view wrap" hidden>
    <div class="cal-layout">
      <section class="cal-panel glass">
        <div class="cal-toolbar">
          <button class="icon-btn" id="cal-prev" aria-label="이전 달">‹</button>
          <h2 id="cal-title">—</h2>
          <button class="icon-btn" id="cal-next" aria-label="다음 달">›</button>
          <button class="pill" id="cal-today">오늘</button>
        </div>
        <div class="cal-filters" id="cal-filters"></div>
        <div class="cal-weekdays">
          <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
      </section>

      <aside class="day-panel glass">
        <h3 id="day-title">—</h3>
        <ul class="event-list compact" id="day-list"></ul>
        <p class="source">데이터: <a href="https://mixxlog.com" target="_blank" rel="noopener">MIXXlog</a> 캘린더 피드 · <span id="feed-status"></span></p>
      </aside>
    </div>
  </main>

  <footer class="footer">
    <p>MIXX-notes · 비공식 NMIXX 팬 페이지 · 일정 출처 <a href="https://mixxlog.com" target="_blank" rel="noopener">MIXXlog</a></p>
  </footer>

  <script src="assets/js/ics.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/music.js"></script>
</body>
</html>
